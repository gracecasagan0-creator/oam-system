<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Employee Login</title>

<style>

body{
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #ffd6e7, #ffeef5);
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.login-box{
    background:#ffffff;
    padding:40px;
    width:320px;
    border-radius:15px;
    box-shadow:0 6px 15px rgba(255,182,193,0.4);
    text-align:center;
}

h2{
    color:#ff8fb1;
    margin-bottom:20px;
}

.flash {
    background: #ffe6e6;
    color: #a70000;
    border: 1px solid #ffb3b3;
    padding: 12px;
    border-radius: 8px;
    margin-bottom: 16px;
}

input{
    width:100%;
    padding:10px;
    margin:10px 0;
    border-radius:8px;
    border:1px solid #f4c2d7;
    outline:none;
}

input:focus{
    border-color:#ff8fb1;
}

button{
    width:100%;
    padding:10px;
    background:#ffb6c1;
    border:none;
    color:white;
    font-size:16px;
    border-radius:8px;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    background:#ff8fb1;
}

.footer{
    margin-top:10px;
    font-size:12px;
    color:#999;
}

</style>
</head>

<body>

<div class="login-box">
    <h2>Employee Login</h2>

    {% with messages = get_flashed_messages() %}
      {% if messages %}
        <div class="flash">{{ messages[0] }}</div>
      {% endif %}
    {% endwith %}

    <form method="POST" action="/employee-login">

        <input type="text" name="employee_id" placeholder="Employee ID" required>

        <input type="password" name="password" placeholder="Password" required>

        <button type="submit">Login</button>

    </form>

    <div class="footer">
        Company Employee Portal
    </div>
</div>

</body>
</html>
