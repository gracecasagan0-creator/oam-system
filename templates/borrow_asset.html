<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Borrow Asset</title>

<style>
body{
    font-family:Segoe UI;
    background:#fff0f6;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.box{
    background:white;
    padding:25px;
    border-radius:12px;
    width:350px;
    box-shadow:0 5px 15px rgba(0,0,0,0.1);
}

h2{
    text-align:center;
    color:#ff4d6d;
}

input,select{
    width:100%;
    padding:10px;
    margin:10px 0;
    border:1px solid #ddd;
    border-radius:6px;
}

button{
    width:100%;
    padding:10px;
    background:#007bff;
    color:white;
    border:none;
    border-radius:6px;
    cursor:pointer;
}
</style>
</head>

<body>

<div class="box">

<h2>Borrow Asset</h2>

<form method="POST">

<input type="text" name="asset_id" value="{{ asset.id }}" readonly>

<input type="text" name="asset_name" value="{{ asset.name }}" readonly>

<input type="text" name="employee_id" placeholder="Your Employee ID" required>

<button type="submit">Confirm Borrow</button>

</form>

</div>

</body>
</html>
