<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Change Password</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI', sans-serif;
}

body{
    display:flex;
    height:100vh;
    background:#fff0f6;
}

/* SIDEBAR */
.sidebar{
    width:230px;
    background:#ffb6c1;
    color:white;
    padding:20px;
}

.sidebar h2{
    text-align:center;
    margin-bottom:30px;
}

.sidebar a{
    display:block;
    color:white;
    text-decoration:none;
    padding:12px;
    margin-bottom:10px;
    border-radius:8px;
    transition:0.3s;
}

.sidebar a:hover{
    background:#ff8fb1;
}

/* MAIN */
.main{
    flex:1;
    padding:20px;
}

/* HEADER */
.header{
    background:white;
    padding:15px;
    border-radius:10px;
    box-shadow:0 3px 10px rgba(255,182,193,0.4);
    margin-bottom:20px;
}

/* FORM */
.form-card{
    background:white;
    padding:25px;
    border-radius:12px;
    box-shadow:0 5px 15px rgba(255,182,193,0.4);
    max-width:500px;
}

.form-card h3{
    color:#ff8fb1;
    margin-bottom:15px;
}

label{
    display:block;
    margin-top:12px;
    font-weight:500;
}

input{
    width:100%;
    padding:10px;
    margin-top:5px;
    border-radius:8px;
    border:1px solid #ffc2d1;
    outline:none;
}

button{
    margin-top:15px;
    width:100%;
    padding:12px;
    background:#ff4d6d;
    color:white;
    border:none;
    border-radius:10px;
    cursor:pointer;
    font-weight:500;
    transition:0.3s;
}

button:hover{
    background:#ff6f8b;
}
</style>
</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">
    <h2>Employee</h2>

    <a href="/employee-dashboard">Dashboard</a>
    <a href="/assigned-assets">View Assigned Assets</a>
    <a href="/request-asset">Request Asset</a>
    <a href="/report-issue">Report Issue</a>
    <a href="/view-assets">View All Assets</a>
    <a href="/update-profile">Update Profile</a>
    <a href="/change-password">Change Password</a>
    <a href="/logout">Logout</a>
</div>

<!-- MAIN -->
<div class="main">

<div class="header">
    <h2>Change Password</h2>
    <p>Update your account security</p>
</div>

<div class="form-card">
    <h3>Password Update</h3>

    <form method="POST" action="/change-password">

        <label>Current Password</label>
        <input type="password" name="current_password" required>

        <label>New Password</label>
        <input type="password" name="new_password" required>

        <label>Confirm New Password</label>
        <input type="password" name="confirm_password" required>

        <button type="submit">Change Password</button>
    </form>
</div>

</div>

</body>
</html>
