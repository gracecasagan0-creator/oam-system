<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Return Asset</title>

<style>
body{
    font-family:Segoe UI;
    background:#fff0f6;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.box{
    background:white;
    padding:25px;
    border-radius:12px;
    width:350px;
    box-shadow:0 5px 15px rgba(0,0,0,0.1);
}

h2{
    text-align:center;
    color:#ff4d6d;
}

p{
    text-align:center;
}

button{
    width:100%;
    padding:10px;
    background:#ff4d6d;
    color:white;
    border:none;
    border-radius:6px;
    cursor:pointer;
}
</style>
</head>

<body>

<div class="box">

<h2>Return Asset</h2>

<p><b>Asset:</b> {{ asset.name }}</p>
<p><b>ID:</b> {{ asset.id }}</p>

<form method="POST">
<button type="submit">Return Now</button>
</form>

</div>

</body>
</html>
